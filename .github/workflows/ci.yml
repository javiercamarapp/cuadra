# Las cuatro puertas que hoy se corren a mano antes de cada commit.
#
# Nada de esto llama a un modelo ni toca Supabase: la suite de `npm test` es
# offline y reproducible a propósito (los arneses que sí gastan dinero se llaman
# `*.prueba.ts` y viven fuera del include de vitest). Por eso CI no necesita
# secretos, y por eso puede correr en cada push sin costo.
name: CI

# EN TODAS LAS RAMAS, y no solo en master/main.
#
# El disparador anterior era `branches: [master, main]`, así que un push a
# cualquier otra rama no corría NADA salvo que ya existiera un PR abierto contra
# master. Y es justo donde aterriza el trabajo autónomo: las rutinas de nube
# pushean a `claude/*`, y hay ramas vivas fuera de esas dos (`claude/auditoria-4`,
# `rutinas/paquete-completo`, `tooling/auditoria-diaria`). El typecheck, el lint,
# las pruebas y el build podían no correr una sola vez sobre ese código.
#
# Correr en cada push cuesta ~2 minutos de runner y no necesita secretos (ver el
# encabezado). Que el PR corra otra vez es duplicado a propósito: es la corrida
# que decide el merge, y el `concurrency` de abajo ya cancela lo que quedó atrás.
on:
  push:
    branches: ['**']
  pull_request:

# Un push nuevo cancela la corrida anterior de la misma rama: no sirve de nada
# esperar el resultado de un commit que ya quedó atrás.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` y no `npm install`: instala exactamente el lockfile y falla si
      # se desincronizó del package.json, que es justo lo que se quiere saber.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # ═════════════════════════════════════════════════════════════════════
      # DOS ROJOS DISTINTOS, DOS PASOS DISTINTOS. AUDITORÍA 11 · G-35.
      #
      # Antes había UN paso —`npm run test:coverage`— que mezclaba dos cosas
      # que no se parecen en nada:
      #
      #   «una prueba se rompió»  → hay que arreglarlo AHORA, no se despliega.
      #   «entró código sin prueba» → deuda, se ve, se prioriza.
      #
      # Como el trinquete vivía DENTRO del paso de las pruebas, GitHub daba
      # el job por fallado ahí y SALTABA los dos siguientes. Resultado
      # medido: el CI de `master` llevaba rojo desde el 3-ago porque la
      # cobertura bajó (las 1,668 pruebas PASABAN), y en esos días el paso de
      # **Build nunca corrió sobre el código del demo** — el paso cuyo propio
      # comentario dice que ya cazó un fallo real que solo aparece ahí
      # (Turbopack no resolvía el `.wasm` del lector de códigos de barras, que
      # es el que lee los tickets que se van a enseñar en la sala). El commit
      # `5fcfb38` dice "build limpio" y su CI terminó en `failure` 100
      # segundos después.
      #
      # Ahora las pruebas van primero y sin instrumentar, el build va en
      # medio, y el trinquete de cobertura va AL FINAL. Sigue poniendo el CI
      # en rojo —es una puerta, no un adorno— pero ya no puede esconder al
      # build detrás de él. Cuesta correr la suite dos veces (~1 min extra de
      # runner); esconder el build cuesta un demo.
      #
      # NO se bajó el umbral. Bajar el medidor para que deje de avisar es
      # apagar el medidor.
      # ═════════════════════════════════════════════════════════════════════
      - name: Tests
        run: npm test

      # LAS PRUEBAS DE TIEMPO, SIN INSTRUMENTAR.
      #
      # `vitest.config.ts` exporta `CUADRA_COBERTURA=1` bajo `--coverage` y
      # tres pruebas de TIEMPO se saltan con esa bandera (la instrumentación
      # de v8 cobra por llamada y el umbral acabaría midiéndola). Con el paso
      # de arriba ya corren, pero este se queda como red explícita:
      # `pruebas_en_ci.test.ts` falla si alguien añade un
      # `skipIf(CUADRA_COBERTURA)` en un archivo que este comando no alcanza,
      # que es como se perdieron estas dos en su día.
      - name: Pruebas de tiempo (sin cobertura)
        run: npx vitest run fundamento duplicados

      # El build va antes del trinquete y después de las pruebas: es el más
      # lento, y las pruebas atrapan casi todo lo que lo haría fallar. Ya cazó
      # un fallo real que solo aparecía aquí: Turbopack no resolvía el .wasm
      # del lector de códigos.
      - name: Build
        run: npm run build
        env:
          # El build no llama a nadie, pero Next evalúa los módulos y algunos
          # leen el entorno al importarse. Valores de relleno: si alguno se usara
          # de verdad, el fallo sería ruidoso en vez de silencioso.
          OPENROUTER_API_KEY: ci-placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder

      # EL TRINQUETE, AL FINAL Y SOLO. El umbral de `vitest.config.ts` es lo
      # que convierte la cobertura en una puerta en vez de en un número que
      # nadie mira. Que esté aquí abajo significa que cuando este paso sea el
      # único rojo, el diagnóstico es inmediato: entró código sin prueba.
      - name: Trinquete de cobertura
        run: npm run test:coverage
